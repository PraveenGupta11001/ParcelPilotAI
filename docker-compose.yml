version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: parcelpilot_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: parcelpilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d parcelpilot"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
